version: '3.9'

services:

  # ─── Infrastructure ───────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-rapex_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rapex_password}
      POSTGRES_DB: ${DB_NAME:-rapex_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rapex_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://${DB_USER:-rapex_user}:${DB_PASSWORD:-rapex_password}@postgres:5432/${DB_NAME:-rapex_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-rapex_redis_pass}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rapex_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # ─── Django Backend ───────────────────────────────
  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_storage_bucket &&
             python manage.py load_initial_settings &&
             if [ \"${AUTO_SEED:-false}\" = \"true\" ]; then python manage.py seed; fi &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - ./backend:/app
      - static-files:/app/staticfiles
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  daphne:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - ./backend:/app
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info --concurrency 4
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Next.js Frontends ────────────────────────────
  frontend-user:
    build:
      context: ./frontend/user
      dockerfile: ../Dockerfile
    command: npm run dev
    volumes:
      - ./frontend/user:/app
      - ./frontend/shared:/shared
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-merchant:
    build:
      context: ./frontend/merchant
      dockerfile: ../Dockerfile
    command: npm run dev
    volumes:
      - ./frontend/merchant:/app
      - ./frontend/shared:/shared
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend/admin
      dockerfile: ../Dockerfile
    command: npm run dev
    volumes:
      - ./frontend/admin:/app
      - ./frontend/shared:/shared
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NODE_ENV: development
    ports:
      - "3003:3003"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-superadmin:
    build:
      context: ./frontend/superadmin
      dockerfile: ../Dockerfile
    command: npm run dev
    volumes:
      - ./frontend/superadmin:/app
      - ./frontend/shared:/shared
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NODE_ENV: development
    ports:
      - "3004:3004"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-rider:
    build:
      context: ./frontend/rider
      dockerfile: ../Dockerfile
    command: npm run dev
    volumes:
      - ./frontend/rider:/app
      - ./frontend/shared:/shared
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NODE_ENV: development
    ports:
      - "3005:3005"
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Nginx ────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - static-files:/static
    ports:
      - "80:80"
    depends_on:
      - backend
      - daphne
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  static-files:
